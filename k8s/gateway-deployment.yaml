apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: armando/gateway:latest      
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CONTACTS_ADDR
              value: "contacts-service:50051"
            - name: DEALS_ADDR
              value: "deals-service:50052"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

